<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curated Journey | Indtara Travels</title>
    <link rel="stylesheet" href="styles.css\?v=1.2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <style>
        :root {
            --gold: #cba153;
            --dark-bg: #050d0a;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(203, 161, 83, 0.2);
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            margin: 0;
            overflow-x: hidden;
        }

        /* Cinematic Hero */
        .cinematic-hero {
            height: 100vh;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-bg-wrapper {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .hero-bg-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.4);
            transform: scale(1.1);
        }

        .hero-vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(5, 13, 10, 0.8) 100%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 900px;
            padding: 0 5%;
        }

        .hero-eyebrow {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 8px;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 20px;
            display: block;
            opacity: 0;
            transform: translateY(20px);
        }

        .hero-title {
            font-family: 'Cinzel', serif;
            font-size: 5rem;
            font-weight: 500;
            line-height: 1;
            margin-bottom: 30px;
            opacity: 0;
            transform: translateY(30px);
        }

        .hero-scroll-cue {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            opacity: 0.6;
        }

        .scroll-line {
            width: 1px;
            height: 60px;
            background: linear-gradient(to bottom, var(--gold), transparent);
        }

        /* Quick Info Bar */
        .info-bar {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 30px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .info-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
        }

        .info-item h4 {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            margin: 0 0 8px 0;
        }

        .info-item span {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: #fff;
        }

        /* Storytelling Flow */
        .story-section {
            padding: 120px 0;
            max-width: 1200px;
            margin: 0 auto;
            padding-left: 5%;
            padding-right: 5%;
        }

        .section-label {
            font-family: 'Great Vibes', cursive;
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 10px;
            display: block;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .overview-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            line-height: 1.8;
            color: rgba(255,255,255,0.8);
            max-width: 800px;
        }

        /* Vertical Journey Timeline */
        .journey-timeline {
            position: relative;
            padding: 60px 0;
        }

        .journey-timeline::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 1px;
            background: linear-gradient(to bottom, transparent, var(--border) 10%, var(--border) 90%, transparent);
        }

        .timeline-day {
            position: relative;
            padding-left: 70px;
            margin-bottom: 80px;
        }

        .timeline-day::after {
            content: '';
            position: absolute;
            left: 15px;
            top: 10px;
            width: 11px;
            height: 11px;
            background: var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--gold);
        }

        .day-num {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            color: var(--gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
        }

        .day-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            margin: 0 0 15px 0;
        }

        .day-desc {
            font-family: 'Montserrat', sans-serif;
            color: rgba(255,255,255,0.6);
            line-height: 1.7;
            max-width: 700px;
        }

        /* Experiences Grid */
        .experiences-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 50px;
        }

        .experience-card {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 30px;
            transition: all 0.4s ease;
        }

        .experience-card:hover {
            border-color: var(--gold);
            transform: translateY(-5px);
        }

        .experience-card h3 {
            font-family: 'Cinzel', serif;
            margin-top: 0;
        }

        /* Sticky Booking Footer for Mobile */
        .mobile-booking-cta {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--dark-bg);
            border-top: 1px solid var(--border);
            padding: 15px 20px;
            z-index: 1000;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .cta-price-info {
            display: flex;
            flex-direction: column;
        }

        .cta-price-info small { font-size: 0.6rem; color: rgba(255,255,255,0.5); text-transform: uppercase; }
        .cta-price-info strong { font-size: 1.1rem; color: var(--gold); }

        .cta-button {
            background: var(--gold);
            color: #000;
            padding: 12px 25px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 2px;
        }

        @media (max-width: 768px) {
            .hero-title { font-size: 3rem; }
            .info-container { flex-direction: column; gap: 20px; }
            .mobile-booking-cta { display: flex; }
            .story-section { padding: 60px 5%; }
            .section-title { font-size: 2.2rem; }
        }
    </style>
    <script src="components.js" defer></script>
</head>

<body>
    <div id="header-placeholder"></div>

    <div id="package-content">
        <!-- Content will be injected here -->
    </div>

    <div class="mobile-booking-cta">
        <div class="cta-price-info">
            <small>Starting from</small>
            <strong id="mobile-price">---</strong>
        </div>
        <a id="book-btn-mobile" href="booking.html" class="cta-button">Book Experience</a>
    </div>

    <div id="footer-placeholder"></div>

    <script src="packages.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const packageId = params.get('id');
            
            let pkg = null;
            for (const country in travelPackages) {
                pkg = travelPackages[country].find(p => p.id === packageId);
                if (pkg) break;
            }

            if (!pkg) {
                window.location.href = 'index.html';
                return;
            }

            // Update page title
            document.title = `${pkg.title} | Indtara Travels`;
            document.getElementById('mobile-price').innerText = pkg.price.split('from ')[1] || pkg.price;
            
            // Set booking link
            const bookingUrl = `booking.html?packageId=${pkg.id}`;
            document.getElementById('book-btn-mobile').href = bookingUrl;

            const container = document.getElementById('package-content');
            
            // Build Content
            let html = `
                <section class="cinematic-hero">
                    <div class="hero-bg-wrapper">
                        <img src="${pkg.image}" alt="${pkg.title}">
                    </div>
                    <div class="hero-vignette"></div>
                    <div class="hero-content">
                        <span class="hero-eyebrow">Luxury Escape</span>
                        <h1 class="hero-title">${pkg.title}</h1>
                    </div>
                    <div class="hero-scroll-cue">
                        <span>Scroll Journey</span>
                        <div class="scroll-line"></div>
                    </div>
                </section>

                <div class="info-bar">
                    <div class="info-container">
                        <div class="info-item">
                            <h4>Duration</h4>
                            <span>${pkg.duration}</span>
                        </div>
                        <div class="info-item">
                            <h4>Experience</h4>
                            <span>${pkg.category || 'Curated'}</span>
                        </div>
                        <div class="info-item">
                            <h4>Price</h4>
                            <span>${pkg.price}</span>
                        </div>
                    </div>
                </div>

                <section class="story-section">
                    <span class="section-label">The Invitation</span>
                    <h2 class="section-title">An Unforgettable Journey</h2>
                    <p class="overview-text">
                        Discover the essence of luxury as we take you on a curated expedition through the most iconic landscapes. 
                        Every moment is designed to awaken your senses and create memories that transcend time.
                    </p>
                </section>

                <section class="story-section" style="background: rgba(255,255,255,0.01);">
                    <span class="section-label">The Narrative</span>
                    <h2 class="section-title">Day-by-Day Journey</h2>
                    <div class="journey-timeline">
                        ${(pkg.itinerary || [
                            { day: 1, title: 'The Arrival', description: 'Begin your journey with a private welcome and transfer to your luxury retreat.' },
                            { day: '2-3', title: 'Deep Discovery', description: 'Engage with the local culture through exclusive private tours and hidden gems.' },
                            { day: '4+', title: 'Pure Serenity', description: 'The final chapter of your story is written in relaxation and world-class comfort.' }
                        ]).map(item => `
                            <div class="timeline-day">
                                <span class="day-num">Day ${item.day}</span>
                                <h3 class="day-title">${item.title}</h3>
                                <p class="day-desc">${item.description}</p>
                            </div>
                        `).join('')}
                    </div>
                </section>

                <section class="story-section">
                    <span class="section-label">The Sanctuary</span>
                    <h2 class="section-title">Luxury Stays</h2>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 50px;">
                        <div style="background: var(--glass); border: 1px solid var(--border); padding: 0; overflow: hidden; border-radius: 4px;">
                            <img src="${pkg.image}" style="width: 100%; height: 300px; object-fit: cover;">
                            <div style="padding: 30px;">
                                <h3 style="font-family: 'Cinzel', serif; color: var(--gold); margin-top: 0;">Royal Suite Experience</h3>
                                <p style="font-size: 0.9rem; color: rgba(255,255,255,0.6); line-height: 1.6;">Handpicked boutique hotels and ultra-luxury resorts that define the spirit of the destination.</p>
                            </div>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 20px;">
                            <div style="background: var(--glass); border: 1px solid var(--border); padding: 30px; border-radius: 4px; display: flex; gap: 20px; align-items: center;">
                                <div style="width: 80px; height: 80px; background: rgba(203,161,83,0.1); display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 2rem;">ðŸ¨</div>
                                <div>
                                    <h4 style="margin: 0; font-family: 'Cinzel', serif;">Premium Transfers</h4>
                                    <p style="margin: 5px 0 0; font-size: 0.8rem; color: rgba(255,255,255,0.5);">Private chauffeured luxury sedans.</p>
                                </div>
                            </div>
                            <div style="background: var(--glass); border: 1px solid var(--border); padding: 30px; border-radius: 4px; display: flex; gap: 20px; align-items: center;">
                                <div style="width: 80px; height: 80px; background: rgba(203,161,83,0.1); display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 2rem;">ðŸ½ï¸</div>
                                <div>
                                    <h4 style="margin: 0; font-family: 'Cinzel', serif;">Gourmet Dining</h4>
                                    <p style="margin: 5px 0 0; font-size: 0.8rem; color: rgba(255,255,255,0.5);">Breakfast and curated dinner experiences included.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="story-section" style="background: #000;">
                    <span class="section-label">The Visuals</span>
                    <h2 class="section-title">Cinematic Gallery</h2>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 250px); gap: 20px; margin-top: 50px;">
                        <div style="grid-column: span 2; grid-row: span 2;"><img src="${pkg.image}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 4px;"></div>
                        <div><img src="assets/varanasi_night.png" style="width: 100%; height: 100%; object-fit: cover; border-radius: 4px;"></div>
                        <div><img src="assets/jaipur_night.png" style="width: 100%; height: 100%; object-fit: cover; border-radius: 4px;"></div>
                    </div>
                </section>

                <section class="story-section" id="booking">
                    <div style="background: var(--glass); border: 1px solid var(--border); padding: 60px; text-align: center; border-radius: 4px;">
                        <span class="section-label">The Beginning</span>
                        <h2 class="section-title" style="margin-bottom: 20px;">Secure Your Date</h2>
                        <p style="margin-bottom: 40px; color: rgba(255,255,255,0.6);">Connect with our luxury travel specialists to personalize your escape.</p>
                        <form id="booking-form" style="max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;">
                            <input type="text" placeholder="Full Name" style="background: transparent; border: 1px solid var(--border); padding: 15px; color: #fff; font-family: 'Montserrat', sans-serif;" required>
                            <input type="email" placeholder="Email Address" style="background: transparent; border: 1px solid var(--border); padding: 15px; color: #fff; font-family: 'Montserrat', sans-serif;" required>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                                <input type="text" placeholder="Approx. Date" style="background: transparent; border: 1px solid var(--border); padding: 15px; color: #fff; font-family: 'Montserrat', sans-serif;">
                                <input type="number" placeholder="Travelers" style="background: transparent; border: 1px solid var(--border); padding: 15px; color: #fff; font-family: 'Montserrat', sans-serif;">
                            </div>
                            <textarea placeholder="Special Requests or Preferences" rows="4" style="background: transparent; border: 1px solid var(--border); padding: 15px; color: #fff; font-family: 'Montserrat', sans-serif;"></textarea>
                            <button type="submit" style="background: var(--gold); color: #000; padding: 18px; border: none; font-family: 'Montserrat', sans-serif; font-weight: 700; text-transform: uppercase; cursor: pointer; letter-spacing: 2px;">Begin My Journey</button>
                        </form>
                    </div>
                </section>
            `;

            container.innerHTML = html;

            // GSAP Entrance
            gsap.to('.hero-eyebrow', { opacity: 1, y: 0, duration: 1, delay: 0.5 });
            gsap.to('.hero-title', { opacity: 1, y: 0, duration: 1.2, delay: 0.7 });

            // Scroll animations
            gsap.utils.toArray('.timeline-day').forEach(day => {
                gsap.from(day, {
                    scrollTrigger: {
                        trigger: day,
                        start: 'top 80%',
                    },
                    opacity: 0,
                    x: -20,
                    duration: 0.8
                });
            });
        });
    </script>
</body>

</html>
