<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Your Journey | Indtara Travels</title>
    <link rel="stylesheet" href="styles.css\?v=1.2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
        :root {
            --gold: #cba153;
            --dark-bg: #050d0a;
            --border: rgba(203, 161, 83, 0.2);
            --glass: rgba(255, 255, 255, 0.02);
        }

        body {
            background-color: var(--dark-bg);
            color: #fff;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
        }

        .booking-page-container {
            max-width: 800px;
            margin: 150px auto 100px;
            padding: 0 5%;
        }

        .booking-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .booking-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 15px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 50px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .step.active { color: var(--gold); }
        .step-num {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid currentColor;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }

        .booking-card {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 50px;
            border-radius: 4px;
        }

        .booking-step-content {
            display: none;
        }

        .booking-step-content.active {
            display: block;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gold);
            margin-bottom: 10px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 15px;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            outline: none;
            box-sizing: border-box;
        }

        .booking-nav-btns {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
        }

        .btn-prev {
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid var(--border);
            padding: 15px 30px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
        }

        .btn-next {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 15px 40px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            font-size: 0.8rem;
            margin-left: auto;
        }

        .summary-card {
            margin-top: 40px;
            border-top: 1px solid var(--border);
            padding-top: 30px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .summary-item strong { color: var(--gold); }
    </style>
    <script src="components.js" defer></script>
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="booking-page-container">
        <div class="booking-header">
            <h1 id="booking-package-title">Plan Your Journey</h1>
            <p style="color: rgba(255,255,255,0.6);">A personalized travel experience crafted just for you.</p>
        </div>

        <div class="step-indicator">
            <div class="step active" id="step-i-1"><span class="step-num">1</span> Preferences</div>
            <div class="step" id="step-i-2"><span class="step-num">2</span> Personalize</div>
            <div class="step" id="step-i-3"><span class="step-num">3</span> Confirm</div>
        </div>

        <div class="booking-card">
            <!-- Step 1: Preferences -->
            <div class="booking-step-content active" id="step-1">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Expected Travel Date</label>
                        <input type="date" id="travel-date">
                    </div>
                    <div class="form-group">
                        <label>Number of Travelers</label>
                        <select id="travelers">
                            <option value="1">1 Person</option>
                            <option value="2" selected>2 Persons</option>
                            <option value="3">3 Persons</option>
                            <option value="4+">Group (4+)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Preferred Pace</label>
                    <div style="display: flex; gap: 20px;">
                        <label style="display: flex; align-items: center; gap: 8px; text-transform: none; color: #fff;">
                            <input type="radio" name="pace" value="relaxed" checked style="width: auto;"> Relaxed
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; text-transform: none; color: #fff;">
                            <input type="radio" name="pace" value="balanced" style="width: auto;"> Balanced
                        </label>
                        <label style="display: flex; align-items: center; gap: 8px; text-transform: none; color: #fff;">
                            <input type="radio" name="pace" value="active" style="width: auto;"> Active
                        </label>
                    </div>
                </div>
            </div>

            <!-- Step 2: Personalize -->
            <div class="booking-step-content" id="step-2">
                <div class="form-group">
                    <label>Luxury Add-ons</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <label style="background: rgba(255,255,255,0.03); padding: 15px; border: 1px solid var(--border); display: flex; align-items: center; gap: 10px; cursor: pointer;">
                            <input type="checkbox" value="spa" style="width: auto;"> Signature Spa Package
                        </label>
                        <label style="background: rgba(255,255,255,0.03); padding: 15px; border: 1px solid var(--border); display: flex; align-items: center; gap: 10px; cursor: pointer;">
                            <input type="checkbox" value="dinner" style="width: auto;"> Private Romantic Dinner
                        </label>
                        <label style="background: rgba(255,255,255,0.03); padding: 15px; border: 1px solid var(--border); display: flex; align-items: center; gap: 10px; cursor: pointer;">
                            <input type="checkbox" value="guide" style="width: auto;"> Exclusive Private Guide
                        </label>
                        <label style="background: rgba(255,255,255,0.03); padding: 15px; border: 1px solid var(--border); display: flex; align-items: center; gap: 10px; cursor: pointer;">
                            <input type="checkbox" value="photo" style="width: auto;"> Professional Photography
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Special Requests</label>
                    <textarea id="special-requests" rows="3" placeholder="Dietary needs, room preferences, or surprises..."></textarea>
                </div>
            </div>

            <!-- Step 3: Confirm -->
            <div class="booking-step-content" id="step-3">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="cust-name" placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="cust-email" placeholder="john@luxury.com">
                    </div>
                </div>
                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="tel" id="cust-phone" placeholder="+1 (555) 000-0000">
                </div>
                <div class="summary-card" id="booking-summary">
                    <!-- Summary will be shown here -->
                </div>
            </div>

            <div class="booking-nav-btns">
                <button class="btn-prev" id="prev-btn" style="display: none;">Back</button>
                <button class="btn-next" id="next-btn">Next Step</button>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="packages.js"></script>
    <script>
        let currentStep = 1;
        const totalSteps = 3;
        const params = new URLSearchParams(window.location.search);
        const packageId = params.get('packageId');

        document.addEventListener('DOMContentLoaded', () => {
            let pkg = null;
            if (packageId) {
                for (const country in travelPackages) {
                    pkg = travelPackages[country].find(p => p.id === packageId);
                    if (pkg) break;
                }
                if (pkg) {
                    document.getElementById('booking-package-title').innerText = `Your ${pkg.title}`;
                }
            }

            const nextBtn = document.getElementById('next-btn');
            const prevBtn = document.getElementById('prev-btn');

            nextBtn.addEventListener('click', () => {
                if (currentStep < totalSteps) {
                    currentStep++;
                    updateStep();
                } else {
                    submitInquiry();
                }
            });

            prevBtn.addEventListener('click', () => {
                if (currentStep > 1) {
                    currentStep--;
                    updateStep();
                }
            });

            function updateStep() {
                // Update visibility
                document.querySelectorAll('.booking-step-content').forEach(s => s.classList.remove('active'));
                document.getElementById(`step-${currentStep}`).classList.add('active');

                // Update indicators
                document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
                for(let i=1; i<=currentStep; i++) {
                    document.getElementById(`step-i-${i}`).classList.add('active');
                }

                // Update buttons
                prevBtn.style.display = currentStep === 1 ? 'none' : 'block';
                nextBtn.innerText = currentStep === totalSteps ? 'Request Luxury Itinerary' : 'Next Step';

                if (currentStep === 3) showSummary();
            }

            function showSummary() {
                const date = document.getElementById('travel-date').value || 'Not selected';
                const travelers = document.getElementById('travelers').value;
                const pace = document.querySelector('input[name="pace"]:checked').value;
                
                let summaryHtml = `
                    <h4 style="font-family: 'Cinzel', serif; color: var(--gold); margin-top: 0;">Journey Summary</h4>
                    <div class="summary-item">Package: <span>${pkg ? pkg.title : 'Custom Journey'}</span></div>
                    <div class="summary-item">Travel Date: <span>${date}</span></div>
                    <div class="summary-item">Travelers: <span>${travelers}</span></div>
                    <div class="summary-item">Pace: <span style="text-transform: capitalize;">${pace}</span></div>
                `;
                document.getElementById('booking-summary').innerHTML = summaryHtml;
            }

            function submitInquiry() {
                nextBtn.innerText = 'SENDING REQUEST...';
                nextBtn.disabled = true;
                
                setTimeout(() => {
                    document.querySelector('.booking-card').innerHTML = `
                        <div style="text-align: center; padding: 40px 0;">
                            <div style="font-size: 4rem; color: #28a745; margin-bottom: 20px;">âœ“</div>
                            <h2 style="font-family: 'Cinzel', serif; color: var(--gold); margin-bottom: 20px;">Your Journey Begins</h2>
                            <p style="color: rgba(255,255,255,0.7); line-height: 1.8;">Thank you for choosing Indtara Travels. Our luxury specialist will contact you within 24 hours to refine your itinerary.</p>
                            <a href="index.html" class="btn-next" style="display: inline-block; margin-top: 30px; text-decoration: none;">Return Home</a>
                        </div>
                    `;
                }, 1500);
            }
        });
    </script>
</body>

</html>
